onboarding = false

[theme]
name = "terminal"
# auto_switch = false

[terminal]
# New sessions start in the launch directory; persisted workspaces keep their own cwd.
new_cwd = "follow"

[keys]
# Prefix
prefix = "ctrl+a"

# General
reload_config = "prefix+q"
detach = "prefix+d"

# Tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"
switch_tab = ["prefix+1..9", "alt+1..9"]

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x","alt+esc"]
focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Herdr's built-in resize step is a fixed 5% of the split; --amount is also a split
# ratio, so 0.01 is about 3 columns on a 270-column split.
[[keys.command]]
key = "ctrl+alt+shift+left"
type = "shell"
command = "herdr pane resize --direction left --amount 0.01 --pane \"$HERDR_ACTIVE_PANE_ID\""
description = "resize pane left"

[[keys.command]]
key = "ctrl+alt+shift+right"
type = "shell"
command = "herdr pane resize --direction right --amount 0.01 --pane \"$HERDR_ACTIVE_PANE_ID\""
description = "resize pane right"

[[keys.command]]
key = "ctrl+alt+shift+up"
type = "shell"
command = "herdr pane resize --direction up --amount 0.02 --pane \"$HERDR_ACTIVE_PANE_ID\""
description = "resize pane up"

[[keys.command]]
key = "ctrl+alt+shift+down"
type = "shell"
command = "herdr pane resize --direction down --amount 0.02 --pane \"$HERDR_ACTIVE_PANE_ID\""
description = "resize pane down"

# Avoid Herdr's built-in prefix+shift+j/k pane-swap bindings.
# previous_agent = "prefix+k"
# next_agent = "prefix+j"

[ui]
accent = "blue"
host_cursor = "native"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
# pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
status_indicators = "dots"
show_agent_labels_on_pane_borders = true

[ui.sound]
enabled = true
