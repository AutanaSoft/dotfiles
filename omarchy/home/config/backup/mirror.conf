# Self-contained declarative configuration for backup-mirror.
# Folder paths are relative to HOME. Exclusions use Folder:pattern syntax;
# patterns are evaluated relative to that folder's transfer root.

[destination]
mount_path = /run/media/lcardenas/Backup
uuid = 7AA6431BA642D6F3

[folders]
# Each uncommented line is a HOME-relative folder to mirror.
# Remove an entry or comment it out to disable that folder.
Documents
Downloads
Music
Pictures
Videos
Work
Projects
.pi
.engram

[exclusions]
# Each uncommented line is Folder:pattern, relative to that folder's transfer root.
Projects:/**/node_modules/
Projects:/**/.turbo/
Projects:/**/.next/
Projects:/**/__pycache__/
Projects:/**/.tmp/
Projects:/**/tmp/
Projects:/**/build/
Projects:/**/dist/
Projects:/**/.angular/
Projects:/**/out/
Projects:/**/coverage/
Projects:/dotfiles/backup/
.pi:/**/npm/
